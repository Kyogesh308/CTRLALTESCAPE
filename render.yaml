services:
  - type: web
    name: ctrl-alt-escape-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: ctrl-alt-escape
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: cae-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://ctrl-alt-escape-backend.onrender.com
      - key: DB_PATH
        value: /data/event.db
      - key: PARTICIPANT_CSV_PATH
        value: ./data/Event_Registration.xlsx
      - key: ADMIN_USERNAME
        value: IEEEdaySreyas@2026
      - key: ADMIN_PASSWORD
        value: IEEErajamatha
      - key: MIN_TEAM_SIZE
        value: "3"
      - key: MAX_TEAM_SIZE
        value: "4"
      - key: REQUEST_EXPIRY_SECONDS
        value: "180"
      - key: ONLINE_THRESHOLD_SECONDS
        value: "15"
      - key: MAX_WARNINGS
        value: "3"
      - key: LEVEL_1_TIME
        value: "900"
      - key: LEVEL_2_TIME
        value: "1080"
      - key: LEVEL_3_TIME
        value: "1320"
      - key: LEVEL_4_TIME
        value: "1320"
      - key: LEVEL_5_TIME
        value: "1380"
      - key: LEVEL_6_TIME
        value: "1200"
      - key: MAX_CARRYOVER_SECONDS
        value: "300"
